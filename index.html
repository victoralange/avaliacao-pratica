<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Pet Shop - Pet World</title>
</head>
<body>
    <header>
        <a id="titulo"><span>Pet</span> World</a>
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a>Sobre nós</a></li>
            <li><a>Calculadora Pet</a></li>
        </ul>
    </header>

    <section id="inicio">
        <div id="apresentacao">
            <div>
                <h3>Pet World</h3>
                <p>Tudo o que o seu pet precisa</p><br>
                <a class="botao-pet" href="#sobre-nos">Sobre nós</a>
            </div>
            <img src="img/imagem-banner.png">
        </div>
    </section>

    <section id="sobre-nos">
        <div class="card">
            <div>
                <h3><i class="fa-solid fa-paw"></i> Sobre nós</h3><br>
                <p>
                    A Pet World nasceu do amor pelos animais e do desejo de oferecer o melhor para eles. Aqui, os tratamos com carinho e respeito, sempre.
                </p>
                <br>
                <a class="botao-pet" href="mailto:contato@petworld.com">Contato (e-mail)</a>
            </div>
            <img src="img/carinho.png">
        </div>
    </section>
    
</body>
</html>
